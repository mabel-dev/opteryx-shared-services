[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opteryx-shared-services"
version = "0.1.0"
description = "Shared capabilities for Opteryx platform services"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "joocer", email = "justin.joyce@joocer.com" }
]
license = { file = "LICENSE" }
keywords = ["opteryx", "config", "logging", "preflight", "healthcheck"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
urls = { "Homepage" = "https://github.com/mabel-dev/opteryx-shared-services" }
requires-python = ">=3.11"

# Only what the CONFIG client needs unconditionally -- it reads Firestore at
# import in every service. Logging is stdlib-only, and every preflight client
# (storage, secretmanager, google.auth) is imported inside the probe that needs
# it, so a service declaring only Firestore checks never pulls in the rest.
dependencies = [
    "google-cloud-firestore==2.*",
]

[project.optional-dependencies]
# The probes that touch these. Declared so a service can install exactly the
# surface it declares checks for, and so CI exercises all of them.
storage = ["google-cloud-storage==3.*"]
secrets = ["google-cloud-secret-manager==2.*"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["opteryx_shared_services*"]

[tool.isort]
profile = "black"
force_single_line = true
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py313"
