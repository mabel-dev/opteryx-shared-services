name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  # Lets release.yaml gate publishing on this exact suite, so the release
  # check can never drift from the one that runs on PRs.
  workflow_call:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:

  pytest:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    - name: deps
      # All extras: the preflight probes import storage and secretmanager
      # lazily, so without them installed those tests would never exercise the
      # real client construction path.
      run: |
        python -m pip install -U pip
        python -m pip install -e ".[test,storage,secrets,web]"

    - name: test
      run: python -m pytest tests/ -v --durations=10
