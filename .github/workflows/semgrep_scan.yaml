name: Semgrep Scan

on:
  push:
  schedule:
    - cron: '17 6 * * *'

jobs:
  semgrep:
    name: Semgrep Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The upload authenticates with this job's own GitHub OIDC token, which
      # authenticate.opteryx verifies against GitHub's JWKS and matches to a
      # registered service account. There is no stored credential to rotate.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Semgrep, rugo, and upload client
        run: python -m pip install --no-cache-dir semgrep rugo "opteryx-upload>=0.6.0"

      - name: Run Semgrep
        run: semgrep scan --config=auto --json --output=semgrep-report.json

      - name: Upload results to Opteryx
        run: python scripts/upload_semgrep_results.py semgrep-report.json
